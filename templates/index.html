<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa RPG Multiplayer</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      body {
        background-color: #121212;
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        width: 100%;
        max-width: 650px;
      }

      h1 {
        text-align: center;
        color: #4ade80;
        margin-bottom: 5px;
      }

      #login-card {
        background: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #333;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #aaa;
        font-size: 14px;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px;
        background: #2a2a2a;
        border: 1px solid #444;
        color: #fff;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 16px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #22c55e;
        color: #000;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        background: #16a34a;
      }

      #game-area {
        display: none;
      }

      #chat-log {
        background: #181818;
        border: 1px solid #333;
        border-radius: 8px;
        height: 400px;
        overflow-y: auto;
        padding: 15px;
        margin-bottom: 15px;
      }

      .message-card {
        background: #242424;
        border-left: 4px solid #4ade80;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 12px;
      }

      .message-card.oculto {
        border-left-color: #a855f7;
        background: #281c30;
      }

      .user-header {
        font-weight: bold;
        color: #4ade80;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .message-card.oculto .user-header {
        color: #c084fc;
      }

      .system-msg {
        text-align: center;
        color: #888;
        font-size: 13px;
        margin: 8px 0;
        font-style: italic;
      }

      .result-box {
        display: inline-block;
        background: #333;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: bold;
        color: #4ade80;
      }

      .crit-success {
        color: #4ade80;
        font-weight: bold;
      }
      .crit-fail {
        color: #ef4444;
        font-weight: bold;
      }
      .dropped {
        text-decoration: line-through;
        opacity: 0.5;
      }

      .gm-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        background: #281c30;
        border: 1px solid #a855f7;
        padding: 8px 12px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>⚔️ Mesa de RPG Multiplayer</h1>

      <!-- 1. TELA DE ENTRADA -->
      <div id="login-card">
        <div class="form-group">
          <label>Seu Nome / Personagem:</label>
          <input type="text" id="username" placeholder="Ex: Arthur Pendragon" />
        </div>
        <div class="form-group">
          <label>Nome da Mesa (Sala):</label>
          <input type="text" id="room" placeholder="Ex: campanha-mortal" />
        </div>

        <div
          class="form-group"
          style="display: flex; align-items: center; gap: 8px; margin-top: 10px"
        >
          <input
            type="checkbox"
            id="enter-as-gm"
            style="width: auto; cursor: pointer"
          />
          <label
            for="enter-as-gm"
            style="
              margin: 0;
              cursor: pointer;
              color: #c084fc;
              font-weight: bold;
            "
          >
            👑 Entrar como Mestre desta mesa
          </label>
        </div>

        <button onclick="entrarNaMesa()">Entrar na Mesa</button>
      </div>

      <!-- 2. PAINEL DE JOGO -->
      <div id="game-area">
        <div id="chat-log"></div>

        <div style="display: flex; gap: 8px">
          <input
            type="text"
            id="command-input"
            placeholder="Ex: 1d20+5, 3#1d2 cara, r(15+20)*3"
            onkeypress="if (event.key === 'Enter') enviarRolagem();"
          />
          <button onclick="enviarRolagem()" style="width: 120px">Rolar</button>
        </div>

        <!-- PAINEL EXCLUSIVO DO MESTRE (Inicia oculto) -->
        <div id="gm-panel" class="gm-controls" style="display: none">
          <input type="checkbox" id="oculto-check" style="cursor: pointer" />
          <label
            for="oculto-check"
            style="
              margin: 0;
              cursor: pointer;
              color: #c084fc;
              font-weight: bold;
            "
          >
            🔒 Rolar Oculto (Apenas você verá o resultado)
          </label>
        </div>
      </div>
    </div>

    <script>
      const socket = io();
      let currentUsername = "";
      let currentRoom = "";

      function entrarNaMesa() {
        const user = document.getElementById("username").value.trim();
        const room = document.getElementById("room").value.trim();
        const wantGM = document.getElementById("enter-as-gm").checked;

        if (!user || !room) {
          alert("Por favor, preencha o seu nome e o nome da mesa!");
          return;
        }

        socket.emit("join_room", {
          username: user,
          room: room,
          is_gm: wantGM,
        });
      }

      function enviarRolagem() {
        const input = document.getElementById("command-input");
        const expressao = input.value.trim();

        const ocultoCheck = document.getElementById("oculto-check");
        const isOculto = ocultoCheck ? ocultoCheck.checked : false;

        if (!expressao) return;

        socket.emit("send_roll", {
          room: currentRoom,
          username: currentUsername,
          expressao: expressao,
          is_oculto: isOculto,
        });

        input.value = "";
      }

      // --- EVENTOS RECEBIDOS DO SERVIDOR ---

      socket.on("join_error", function (data) {
        alert(data.msg);
      });

      socket.on("join_success", function (data) {
        currentUsername = data.username;
        currentRoom = data.room;

        document.getElementById("login-card").style.display = "none";
        document.getElementById("game-area").style.display = "block";

        // Se for o Mestre, revela o botão de Rolar Oculto
        if (data.is_gm) {
          document.getElementById("gm-panel").style.display = "flex";
        }
      });

      socket.on("system_message", function (data) {
        const log = document.getElementById("chat-log");
        log.innerHTML += `<div class="system-msg">${data.msg}</div>`;
        log.scrollTop = log.scrollHeight;
      });

      socket.on("receive_roll", function (data) {
        const log = document.getElementById("chat-log");
        const cardClass = data.is_oculto
          ? "message-card oculto"
          : "message-card";

        const htmlMessage = `
            <div class="${cardClass}">
                <div class="user-header">${data.username}</div>
                <div>${data.html}</div>
            </div>
        `;

        log.innerHTML += htmlMessage;
        log.scrollTop = log.scrollHeight;
      });
    </script>
  </body>
</html>
