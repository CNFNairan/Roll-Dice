<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paroroller RPG Multiplayer</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        background-color: #121212;
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
      }

      .container {
        width: 100%;
        max-width: 3000px;
        height: calc(100vh - 30px);
        display: flex;
        flex-direction: column;
      }

      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      h1 {
        color: #4ade80;
        margin: 0;
        font-size: 22px;
      }

      .btn-exit {
        background: #333;
        color: #aaa;
        border: 1px solid #444;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s ease;
      }

      .btn-exit:hover {
        background: #444;
        color: #fff;
      }

      #login-card {
        background: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #333;
        max-width: 650px;
        margin: 0 auto;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #aaa;
        font-size: 14px;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 10px;
        background: #2a2a2a;
        border: 1px solid #444;
        color: #fff;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 16px;
      }

      input:disabled,
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed !important;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #22c55e;
        color: #000;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #16a34a;
      }

      #game-area {
        display: none;
      }

      .app-shell {
        display: none;
        width: 100%;
        flex: 1;
        min-height: 0;
        background: #121212;
        border: 1px solid #333;
        border-radius: 12px;
        overflow: hidden;
      }

      .sidebar-nav {
        width: 260px;
        background: #171717;
        border-right: 1px solid #333;
        padding: 16px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex-shrink: 0;
        overflow-y: auto;
      }

      .nav-btn {
        width: 100%;
        padding: 12px;
        background: #222;
        border: 1px solid #444;
        border-radius: 8px;
        color: #aaa;
        font-weight: bold;
        cursor: pointer;
      }

      .nav-btn.active {
        background: #3b82f6;
        color: #fff;
        border-color: #3b82f6;
      }

      .sidebar-card {
        background: #1f1f1f;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 12px;
      }

      .sidebar-title {
        color: #3b82f6;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .sidebar-player-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .main-content {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .page-panel {
        display: none;
        width: 100%;
        height: 100%;
        padding: 16px;
        box-sizing: border-box;
        min-height: 0;
        overflow: hidden;
      }

      .page-panel.active {
        display: flex;
        flex-direction: column;
      }

      .page-inner {
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: 100%;
        min-height: 0;
      }

      .mesa-grid {
        display: flex;
        gap: 16px;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      #main-content {
        flex: 2;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #side-content {
        flex: 1;
        max-width: 320px;
        background: #181818;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 15px;
        box-sizing: border-box;
        overflow-y: auto;
      }

      #chat-log {
        background: #181818;
        border: 1px solid #333;
        border-radius: 8px;
        min-height: 220px;
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        margin-bottom: 15px;
      }

      #text-chat-log {
        flex: 1;
        min-height: 220px;
        background: #121212;
        border: 1px solid #222;
        border-radius: 6px;
        padding: 10px;
        overflow-y: auto;
        margin-bottom: 10px;
      }

      .chat-shell {
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100%;
        min-height: 0;
      }

      .chat-input-row {
        display: flex;
        gap: 8px;
      }

      .chat-input-row input {
        flex: 1;
      }

      .text-message-card {
        background: #242424;
        border-left: 4px solid #3b82f6;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 10px;
        word-break: break-word;
      }
      .text-message-card .user-header {
        color: #3b82f6;
      }

      /* LAYOUT DA MESA JÁ EXISTENTE */
      #game-layout {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 100%;
        height: 100%;
      }

      @media (max-width: 900px) {
        .app-shell {
          flex-direction: column;
          min-height: auto;
        }
        .sidebar-nav {
          width: 100%;
          border-right: none;
          border-bottom: 1px solid #333;
          flex-direction: row;
          flex-wrap: wrap;
          max-height: 220px;
        }
        .sidebar-nav .nav-btn {
          flex: 1 1 140px;
        }
      }

      @media (max-width: 768px) {
        .mesa-grid {
          flex-direction: column;
        }
        #side-content {
          max-width: none;
          width: 100%;
        }
        .gm-actions {
          flex-direction: column;
        }
        .btn-gm {
          min-width: 0;
          width: 100%;
        }
        .chat-input-row {
          flex-direction: column;
        }
        .chat-input-row button {
          width: 100%;
        }
      }

      .player-list-title {
        color: #4ade80;
        margin-top: 0;
        margin-bottom: 15px;
        font-size: 16px;
        text-align: center;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .player-item {
        padding: 8px 12px;
        background: #242424;
        border-radius: 4px;
        margin-bottom: 8px;
        font-size: 14px;
        display: flex;
        align-items: center;
      }

      .player-item.gm-highlight {
        border-left: 4px solid #a855f7;
        background: #281c30;
        color: #c084fc;
        font-weight: bold;
      }

      #initiative-bar {
        background: #181818;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 12px;
        display: none;
      }

      .bar-title {
        font-size: 12px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
      }

      .turn-list {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .turn-chip {
        background: #282828;
        border: 1px solid #444;
        padding: 6px 12px;
        border-radius: 20px;
        white-space: nowrap;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .turn-chip.active {
        background: #15803d;
        border-color: #4ade80;
        color: #fff;
        font-weight: bold;
        box-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
      }

      #chat-log {
        background: #181818;
        border: 1px solid #333;
        border-radius: 8px;
        height: 380px;
        overflow-y: auto;
        padding: 15px;
        margin-bottom: 15px;
      }

      .message-card {
        background: #242424;
        border-left: 4px solid #4ade80;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 12px;
      }

      .message-card.oculto {
        border-left-color: #a855f7;
        background: #281c30;
      }

      .user-header {
        font-weight: bold;
        color: #4ade80;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .message-card.oculto .user-header {
        color: #c084fc;
      }
      .system-msg {
        text-align: center;
        color: #888;
        font-size: 13px;
        margin: 8px 0;
        font-style: italic;
      }

      .result-box {
        display: inline-block;
        background: #333;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: bold;
        color: #4ade80;
      }

      .crit-success {
        color: #4ade80;
        font-weight: bold;
      }
      .crit-fail {
        color: #ef4444;
        font-weight: bold;
      }
      .dropped {
        text-decoration: line-through;
        opacity: 0.5;
      }

      .gm-box {
        background: #221c28;
        border: 1px solid #a855f7;
        border-radius: 8px;
        padding: 12px;
        margin-top: 15px;
      }

      .gm-title {
        color: #c084fc;
        font-weight: bold;
        margin-bottom: 10px;
        font-size: 15px;
      }

      .gm-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      .btn-gm {
        background: #a855f7;
        color: #fff;
        padding: 8px 12px;
        font-size: 13px;
        flex: 1;
        min-width: 120px;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
      }

      .btn-gm:hover:not(:disabled) {
        background: #9333ea;
      }
      .btn-subtle {
        background: #333;
        color: #aaa;
        font-weight: normal;
      }
      .btn-subtle:hover:not(:disabled) {
        background: #444;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-top">
        <h1>⚔️ PAROROLLER</h1>
        <div style="display: flex; gap: 8px; align-items: center">
          <button
            id="btn-change-room"
            class="btn-exit"
            style="display: none"
            onclick="sairDaMesa()"
          >
            Trocar de Mesa
          </button>
        </div>
      </div>

      <!-- TELA DE LOGIN -->
      <div id="login-card">
        <div class="form-group">
          <label>Seu Nome / Personagem:</label>
          <input type="text" id="username" placeholder="Ex: Arthur Pendragon" />
        </div>
        <div class="form-group">
          <label>Nome da Mesa (Sala):</label>
          <input type="text" id="room" placeholder="Ex: campanha-mortal" />
        </div>
        <div
          class="form-group"
          style="display: flex; align-items: center; gap: 8px"
        >
          <input
            type="checkbox"
            id="enter-as-gm"
            style="width: auto; cursor: pointer"
          />
          <label
            for="enter-as-gm"
            style="
              margin: 0;
              cursor: pointer;
              color: #c084fc;
              font-weight: bold;
            "
          >
            👑 Entrar/Reconectar como Mestre
          </label>
        </div>
        <button onclick="entrarNaMesa()">Entrar na Mesa</button>
      </div>

      <div id="app-shell" class="app-shell">
        <aside class="sidebar-nav">
          <div class="sidebar-title">Navegação</div>
          <button class="nav-btn active" data-page="mesa" onclick="showPage('mesa')">
            📊 Mesa
          </button>
          <button class="nav-btn" data-page="conversa" onclick="showPage('conversa')">
            💬 Conversa
          </button>

          <div class="sidebar-card">
            <div class="sidebar-title">Sala: <strong id="sidebar-room-name">-</strong></div>
            <div style="color: #aaa; font-size: 14px; line-height: 1.5;">
              Usuário: <strong id="sidebar-user-name">-</strong><br />
              Status: <span id="combat-status" style="color: #ef4444">FORA DE COMBATE</span>
            </div>
          </div>

          <div class="sidebar-card">
            <div class="sidebar-title">Jogadores</div>
            <div id="sidebar-player-list" class="sidebar-player-list"></div>
          </div>
        </aside>

        <main class="main-content">
          <section id="page-mesa" class="page-panel active">
            <div class="page-inner">
              <div class="mesa-grid">
                <div id="main-content">
                  <div id="initiative-bar">
                    <div class="bar-title">
                      <span>⚔️ Ordem de Ação</span>
                      <span id="combat-status" style="color: #ef4444"
                        >FORA DE COMBATE</span
                      >
                    </div>
                    <div id="turn-chips" class="turn-list">
                      <!-- Chips dinâmicos -->
                    </div>
                  </div>

                  <div id="chat-log"></div>

                  <div style="display: flex; gap: 8px">
                    <input
                      type="text"
                      id="command-input"
                      placeholder="Ex: 1d20+5 (Rolagem) ou 'Olá grupo!' (Chat)"
                      onkeypress="if (event.key === 'Enter') enviarRolagem();"
                    />
                    <button
                      id="btn-rolar"
                      onclick="enviarRolagem()"
                      style="width: 100px"
                    >
                      Rolar
                    </button>
                  </div>

                  <div id="gm-panel" class="gm-box" style="display: none">
                    <div class="gm-title">
                      👑 Painel de Gerenciamento do Mestre
                    </div>

                    <div class="gm-actions">
                      <button
                        id="btn-toggle-combat"
                        class="btn-gm"
                        onclick="toggleCombate()"
                      >
                        Iniciar Combate ⚔️
                      </button>
                      <button class="btn-gm" onclick="proximoTurno()">
                        Próximo Turno ⏩
                      </button>
                    </div>

                    <div style="display: flex; gap: 6px; margin-bottom: 10px">
                      <input
                        type="text"
                        id="npc-name"
                        placeholder="Nome (Ex: Orc)"
                        style="flex: 2"
                      />
                      <input
                        type="number"
                        id="npc-init"
                        placeholder="Iniciativa"
                        style="flex: 1"
                      />
                      <button
                        class="btn-gm"
                        onclick="adicionarCombatente()"
                        style="width: 70px"
                      >
                        + Add
                      </button>
                    </div>

                    <div class="gm-actions" style="margin-bottom: 10px">
                      <button
                        class="btn-gm"
                        onclick="limparChat()"
                        style="background: #ef4444"
                      >
                        Limpar Logs 🗑️
                      </button>
                      <button
                        id="btn-lock-chat"
                        class="btn-gm"
                        onclick="travarChat()"
                        style="background: #f59e0b"
                      >
                        Travar Logs 🔒
                      </button>
                    </div>

                    <div
                      style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        background: #1a1520;
                        padding: 8px;
                        border-radius: 4px;
                      "
                    >
                      <div style="display: flex; align-items: center; gap: 8px">
                        <input
                          type="checkbox"
                          id="oculto-check"
                          style="width: auto; cursor: pointer"
                        />
                        <label
                          for="oculto-check"
                          style="
                            margin: 0;
                            cursor: pointer;
                            color: #c084fc;
                            font-weight: bold;
                            font-size: 13px;
                          "
                        >
                          🔒 Rolar Oculto
                        </label>
                      </div>
                      <button
                        class="btn-gm btn-subtle"
                        onclick="liberarMestre()"
                        style="font-size: 11px; padding: 4px 8px; width: auto"
                      >
                        Liberar Posto Mestre
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </section>

          <section id="page-conversa" class="page-panel">
            <div class="chat-shell">
              <div class="sidebar-title">💬 Conversa</div>
              <div id="text-chat-log"></div>
              <div class="chat-input-row">
                <input
                  type="text"
                  id="chat-input"
                  placeholder="Digite a mensagem..."
                  onkeypress="if (event.key === 'Enter') enviarMensagemDiretaChat();"
                />
                <button
                  onclick="enviarMensagemDiretaChat()"
                  style="width: 90px; background: #3b82f6; color: white"
                >
                  Enviar
                </button>
              </div>
            </div>
          </section>
        </main>
      </div>

    <script>
      const socket = io();
      let currentUsername = "";
      let currentRoom = "";
      let isGM = false;
      let currentPage = "mesa";

      window.onload = function () {
        const savedUser = localStorage.getItem("rpg_username");
        const savedRoom = localStorage.getItem("rpg_room");
        const savedGM = localStorage.getItem("rpg_is_gm") === "true";

        if (savedUser) document.getElementById("username").value = savedUser;
        if (savedRoom) document.getElementById("room").value = savedRoom;
        if (savedGM) document.getElementById("enter-as-gm").checked = savedGM;

        if (savedUser && savedRoom) {
          entrarNaMesa(true);
        }
      };

      function entrarNaMesa(isAuto = false) {
        const user = document.getElementById("username").value.trim();
        const room = document.getElementById("room").value.trim();
        const wantGM = document.getElementById("enter-as-gm").checked;

        if (!user || !room) {
          if (!isAuto) alert("Preencha o seu nome e o nome da mesa!");
          return;
        }

        localStorage.setItem("rpg_username", user);
        localStorage.setItem("rpg_room", room);
        localStorage.setItem("rpg_is_gm", wantGM);

        socket.emit("join_room", { username: user, room: room, is_gm: wantGM });
      }

      function sairDaMesa() {
        localStorage.removeItem("rpg_room");
        localStorage.removeItem("rpg_is_gm");
        location.reload();
      }

      function showPage(pageName) {
        currentPage = pageName === "conversa" ? "conversa" : "mesa";

        document.querySelectorAll(".nav-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.page === currentPage);
        });

        document.getElementById("page-mesa").classList.toggle("active", currentPage === "mesa");
        document.getElementById("page-conversa").classList.toggle("active", currentPage === "conversa");
      }

      /* ATUALIZADO: Filtro Inteligente de Rolagem vs Chat */
      function enviarRolagem() {
        const input = document.getElementById("command-input");
        const expressao = input.value.trim();
        const ocultoCheck = document.getElementById("oculto-check");
        const isOculto = ocultoCheck ? ocultoCheck.checked : false;

        if (!expressao) return;

        // Verifica se é rolagem usando Regex: Contém "d20", "r(", "#" ou equações matemáticas
        const regexRolagem = /(^|\s|\b)(\d*d\d+|r\(|#)/i;
        const regexMatematica = /^[0-9+\-*/(). ]+$/;

        if (regexRolagem.test(expressao) || regexMatematica.test(expressao)) {
          // É uma rolagem de dados ou cálculo
          socket.emit("send_roll", {
            room: currentRoom,
            username: currentUsername,
            expressao: expressao,
            is_oculto: isOculto,
          });
        } else {
          // É um texto sem dados: Redireciona para o Chat
          socket.emit("send_text_chat", {
            room: currentRoom,
            username: currentUsername,
            message: expressao,
          });

          showPage("conversa");
        }

        input.value = "";
      }

      /* NOVO: Enviar mensagem direto pelo input da Sidebar */
      function enviarMensagemDiretaChat() {
        const input = document.getElementById("chat-input");
        const msg = input.value.trim();
        if (!msg) return;

        socket.emit("send_text_chat", {
          room: currentRoom,
          username: currentUsername,
          message: msg,
        });

        input.value = "";
      }

      function limparChat() {
        if (
          confirm(
            "Tem certeza que deseja apagar todo o histórico de rolagens da mesa?",
          )
        ) {
          socket.emit("clear_chat", {
            room: currentRoom,
            username: currentUsername,
          });
        }
      }

      function travarChat() {
        socket.emit("toggle_chat_lock", {
          room: currentRoom,
          username: currentUsername,
        });
      }

      function atualizarInterfaceChat(isLocked) {
        const input = document.getElementById("command-input");
        const btn = document.getElementById("btn-rolar");
        const btnLock = document.getElementById("btn-lock-chat");

        if (isLocked) {
          if (btnLock) {
            btnLock.innerHTML = "Destravar Logs 🔓";
            btnLock.style.background = "#10b981";
          }
          if (!isGM) {
            input.disabled = true;
            btn.disabled = true;
            input.placeholder = "O mestre travou as rolagens...";
          }
        } else {
          if (btnLock) {
            btnLock.innerHTML = "Travar Logs 🔒";
            btnLock.style.background = "#f59e0b";
          }
          input.disabled = false;
          btn.disabled = false;
          input.placeholder = "Ex: 1d20+5 (Rolagem) ou 'Olá grupo!' (Chat)";
        }
      }

      function toggleCombate() {
        socket.emit("update_combat_state", {
          room: currentRoom,
          username: currentUsername,
          action: "toggle_combat",
        });
      }

      function proximoTurno() {
        socket.emit("update_combat_state", {
          room: currentRoom,
          username: currentUsername,
          action: "next_turn",
        });
      }

      function adicionarCombatente() {
        const name = document.getElementById("npc-name").value.trim();
        const init = document.getElementById("npc-init").value.trim();
        if (!name) return;
        socket.emit("update_combat_state", {
          room: currentRoom,
          username: currentUsername,
          action: "add_combatant",
          name: name,
          init: init || 0,
        });
        document.getElementById("npc-name").value = "";
        document.getElementById("npc-init").value = "";
      }

      function removerCombatente(index) {
        socket.emit("update_combat_state", {
          room: currentRoom,
          username: currentUsername,
          action: "remove_combatant",
          index: index,
        });
      }

      function liberarMestre() {
        socket.emit("leave_gm", {
          room: currentRoom,
          username: currentUsername,
        });
      }

      // SOCKET EVENTS
      socket.on("join_error", function (data) {
        alert(data.msg);
      });

      socket.on("join_success", function (data) {
        currentUsername = data.username;
        currentRoom = data.room;
        isGM = data.is_gm;

        document.getElementById("login-card").style.display = "none";
        document.getElementById("app-shell").style.display = "flex";
        document.getElementById("btn-change-room").style.display =
          "inline-block";

        if (isGM) {
          document.getElementById("gm-panel").style.display = "block";
        } else {
          document.getElementById("gm-panel").style.display = "none";
        }
        document.getElementById("sidebar-room-name").textContent = data.room;
        document.getElementById("sidebar-user-name").textContent = data.username;
        showPage("mesa");
        atualizarInterfaceChat(data.chat_locked);
      });

      socket.on("gm_status_changed", function (data) {
        isGM = data.is_gm;
        document.getElementById("gm-panel").style.display = "none";
        localStorage.setItem("rpg_is_gm", false);
      });

      socket.on("system_message", function (data) {
        const log = document.getElementById("chat-log");
        log.innerHTML += `<div class="system-msg">${data.msg}</div>`;
        log.scrollTop = log.scrollHeight;
      });

      socket.on("chat_cleared", function (data) {
        const log = document.getElementById("chat-log");
        const textLog = document.getElementById("text-chat-log");
        log.innerHTML = `<div class="system-msg">${data.msg}</div>`;
        if (textLog) {
          textLog.innerHTML = "";
        }
      });

      socket.on("chat_lock_updated", function (data) {
        atualizarInterfaceChat(data.locked);
        const log = document.getElementById("chat-log");
        log.innerHTML += `<div class="system-msg" style="color: #f59e0b;">${data.msg}</div>`;
        log.scrollTop = log.scrollHeight;
      });

      socket.on("update_players", function (players) {
        const containers = [
          document.getElementById("player-list-container"),
          document.getElementById("sidebar-player-list"),
        ];

        players.sort((a, b) => (b.is_gm === true) - (a.is_gm === true));

        const uniquePlayers = [];
        const seen = new Set();
        for (const p of players) {
          if (!seen.has(p.username)) {
            seen.add(p.username);
            uniquePlayers.push(p);
          }
        }

        containers.forEach((container) => {
          if (!container) return;
          container.innerHTML = "";
          uniquePlayers.forEach((p) => {
            const isMe = p.username === currentUsername ? " (Você)" : "";
            if (p.is_gm) {
              container.innerHTML += `<div class="player-item gm-highlight">👑 ${p.username}${isMe}</div>`;
            } else {
              container.innerHTML += `<div class="player-item">🎲 ${p.username}${isMe}</div>`;
            }
          });
        });
      });

      /* ROLAGENS (DADOS) */
      socket.on("load_history", function (historyList) {
        const log = document.getElementById("chat-log");
        log.innerHTML = "";
        historyList.forEach((data) => {
          const cardClass = data.is_oculto
            ? "message-card oculto"
            : "message-card";
          log.innerHTML += `
                <div class="${cardClass}">
                    <div class="user-header">${data.username}</div>
                    <div>${data.html}</div>
                </div>
            `;
        });
        log.scrollTop = log.scrollHeight;
      });

      socket.on("receive_roll", function (data) {
        const log = document.getElementById("chat-log");
        const cardClass = data.is_oculto
          ? "message-card oculto"
          : "message-card";
        log.innerHTML += `
            <div class="${cardClass}">
                <div class="user-header">${data.username}</div>
                <div>${data.html}</div>
            </div>
        `;
        log.scrollTop = log.scrollHeight;
      });

      /* NOVO: EVENTOS DO CHAT DE TEXTO */
      socket.on("load_chat_history", function (chatHistory) {
        const log = document.getElementById("text-chat-log");
        log.innerHTML = "";
        chatHistory.forEach((data) => {
          log.innerHTML += `
            <div class="text-message-card">
              <div class="user-header">${data.username}</div>
              <div style="font-size: 14px; word-wrap: break-word; line-height: 1.4;">${data.message}</div>
            </div>
          `;
        });
        log.scrollTop = log.scrollHeight;
      });

      socket.on("receive_text_chat", function (data) {
        const log = document.getElementById("text-chat-log");
        log.innerHTML += `
          <div class="text-message-card">
            <div class="user-header">${data.username}</div>
            <div style="font-size: 14px; word-wrap: break-word; line-height: 1.4;">${data.message}</div>
          </div>
        `;
        log.scrollTop = log.scrollHeight;
      });

      socket.on("update_combat", function (combat) {
        const bar = document.getElementById("initiative-bar");
        const chipsContainer = document.getElementById("turn-chips");
        const statusText = document.getElementById("combat-status");
        const btnToggle = document.getElementById("btn-toggle-combat");

        if (combat.order.length > 0 || combat.active) {
          bar.style.display = "block";
        } else {
          bar.style.display = "none";
        }

        if (combat.active) {
          statusText.innerText = "EM COMBATE ⚔️";
          statusText.style.color = "#22c55e";
          if (btnToggle) btnToggle.innerText = "Encerrar Combate 🕊️";
        } else {
          statusText.innerText = "FORA DE COMBATE";
          statusText.style.color = "#ef4444";
          if (btnToggle) btnToggle.innerText = "Iniciar Combate ⚔️";
        }

        chipsContainer.innerHTML = "";
        combat.order.forEach((c, idx) => {
          const isActive = combat.active && idx === combat.turn_index;
          const chipClass = isActive ? "turn-chip active" : "turn-chip";
          let removeBtn = isGM
            ? `<span onclick="removerCombatente(${idx})" style="cursor:pointer; color:#ef4444; margin-left:4px;">✕</span>`
            : "";
          chipsContainer.innerHTML += `
                <div class="${chipClass}">
                    <span>${c.name} (${c.init})</span>
                    ${removeBtn}
                </div>
            `;
        });
      });
    </script>
  </body>
</html>
