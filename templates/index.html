<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paroroller RPG Multiplayer</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <div class="header-top">
        <h1>⚔️ PAROROLLER</h1>
        <div style="display: flex; gap: 8px; align-items: center">
          <button
            id="btn-change-room"
            class="btn-exit"
            style="display: none"
            onclick="sairDaMesa()"
          >
            Trocar de Mesa
          </button>
        </div>
      </div>

      <div id="login-card">
        <div class="form-group">
          <label>Seu Nome / Personagem:</label>
          <input type="text" id="username" placeholder="Ex: Arthur Pendragon" />
        </div>
        <div class="form-group">
          <label>Nome da Mesa (Sala):</label>
          <input type="text" id="room" placeholder="Ex: campanha-mortal" />
        </div>
        <div
          class="form-group"
          style="display: flex; align-items: center; gap: 8px"
        >
          <input
            type="checkbox"
            id="enter-as-gm"
            style="width: auto; cursor: pointer"
          />
          <label
            for="enter-as-gm"
            style="
              margin: 0;
              cursor: pointer;
              color: #c084fc;
              font-weight: bold;
            "
          >
            👑 Entrar/Reconectar como Mestre
          </label>
        </div>
        <button onclick="entrarNaMesa()">Entrar na Mesa</button>
      </div>

      <div id="app-shell" class="app-shell">
        <aside class="sidebar-nav">
          <div class="sidebar-title">Navegação</div>
          <button
            class="nav-btn active"
            data-page="mesa"
            onclick="showPage('mesa')"
          >
            📊 Mesa
          </button>
          <button
            class="nav-btn"
            data-page="conversa"
            onclick="showPage('conversa')"
          >
            💬 Conversa
          </button>

          <div class="sidebar-card">
            <div class="sidebar-title">
              Sala: <strong id="sidebar-room-name">-</strong>
            </div>
            <div style="color: #aaa; font-size: 14px; line-height: 1.5">
              Usuário: <strong id="sidebar-user-name">-</strong><br />
              Status:
              <span id="sidebar-combat-status" style="color: #ef4444"
                >FORA DE COMBATE</span
              >
            </div>
          </div>

          <div class="sidebar-card">
            <div class="sidebar-title">Jogadores</div>
            <div id="sidebar-player-list" class="sidebar-player-list"></div>
          </div>
        </aside>

        <main class="main-content">
          <section id="page-mesa" class="page-panel active">
            <div class="page-inner">
              <div class="mesa-grid">
                <div id="main-content">
                  <div id="initiative-bar">
                    <div class="bar-title">
                      <span>⚔️ Ordem de Ação</span>
                      <span id="combat-status" style="color: #ef4444"
                        >FORA DE COMBATE</span
                      >
                    </div>
                    <div id="turn-chips" class="turn-list"></div>
                  </div>

                  <div id="chat-log"></div>

                  <div style="display: flex; gap: 8px">
                    <input
                      type="text"
                      id="command-input"
                      placeholder="Ex: 1d20+5 (Rolagem) ou 'Olá grupo!' (Chat)"
                      onkeypress="if (event.key === 'Enter') enviarRolagem();"
                    />
                    <button
                      id="btn-rolar"
                      onclick="enviarRolagem()"
                      style="width: 100px"
                    >
                      Rolar
                    </button>
                  </div>

                  <div id="gm-panel" class="gm-box" style="display: none">
                    <div class="gm-title">
                      👑 Painel de Gerenciamento do Mestre
                    </div>

                    <div class="gm-actions">
                      <button
                        id="btn-toggle-combat"
                        class="btn-gm"
                        onclick="toggleCombate()"
                      >
                        Iniciar Combate ⚔️
                      </button>
                      <button class="btn-gm" onclick="proximoTurno()">
                        Próximo Turno ⏩
                      </button>
                    </div>

                    <div style="display: flex; gap: 6px; margin-bottom: 10px">
                      <input
                        type="text"
                        id="npc-name"
                        placeholder="Nome (Ex: Orc)"
                        style="flex: 2"
                      />
                      <input
                        type="number"
                        id="npc-init"
                        placeholder="Iniciativa"
                        style="flex: 1"
                      />
                      <button
                        class="btn-gm"
                        onclick="adicionarCombatente()"
                        style="width: 70px"
                      >
                        + Add
                      </button>
                    </div>

                    <div class="gm-actions" style="margin-bottom: 10px">
                      <button
                        class="btn-gm"
                        onclick="limparChat()"
                        style="background: #ef4444"
                      >
                        Limpar Logs 🗑️
                      </button>
                      <button
                        id="btn-lock-chat"
                        class="btn-gm"
                        onclick="travarChat()"
                        style="background: #f59e0b"
                      >
                        Travar Logs 🔒
                      </button>
                    </div>

                    <div
                      style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        background: #1a1520;
                        padding: 8px;
                        border-radius: 4px;
                      "
                    >
                      <div style="display: flex; align-items: center; gap: 8px">
                        <input
                          type="checkbox"
                          id="oculto-check"
                          style="width: auto; cursor: pointer"
                        />
                        <label
                          for="oculto-check"
                          style="
                            margin: 0;
                            cursor: pointer;
                            color: #c084fc;
                            font-weight: bold;
                            font-size: 13px;
                          "
                          >🔒 Rolar Oculto</label
                        >
                      </div>
                      <button
                        class="btn-gm btn-subtle"
                        onclick="liberarMestre()"
                        style="font-size: 11px; padding: 4px 8px; width: auto"
                      >
                        Liberar Posto Mestre
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section id="page-conversa" class="page-panel">
            <div class="chat-shell">
              <div class="sidebar-title">💬 Conversa</div>
              <div id="text-chat-log"></div>
              <div class="chat-input-row">
                <input
                  type="text"
                  id="chat-input"
                  placeholder="Digite a mensagem..."
                  onkeypress="
                    if (event.key === 'Enter') enviarMensagemDiretaChat();
                  "
                />
                <button
                  onclick="enviarMensagemDiretaChat()"
                  style="width: 90px; background: #3b82f6; color: white"
                >
                  Enviar
                </button>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
